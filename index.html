<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#11151a">

    <title>KAVRYX</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <div id="app">

        <!-- =========================
             ГЛАВНОЕ МЕНЮ
             ========================= -->

        <main id="mainMenu" class="screen active">

            <div class="world-background">

                <div class="sky"></div>

                <div class="moon"></div>

                <div class="mountains mountains-back"></div>
                <div class="mountains mountains-front"></div>

                <div class="ground"></div>

                <!-- Поселение -->
                <div class="settlement">

                    <div class="house house-large">
                        <div class="house-roof"></div>
                        <div class="house-body"></div>
                        <div class="house-door"></div>
                        <div class="house-window"></div>
                    </div>

                    <div class="house house-small">
                        <div class="house-roof"></div>
                        <div class="house-body"></div>
                        <div class="house-door"></div>
                    </div>

                    <div class="tower">
                        <div class="tower-roof"></div>
                        <div class="tower-body"></div>
                        <div class="tower-window"></div>
                    </div>

                    <div class="fire">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <div class="dark-overlay"></div>

            </div>


            <!-- =========================
                 ИНТЕРФЕЙС МЕНЮ
                 ========================= -->

            <div class="menu-interface">

                <div class="logo-container">

                    <div class="logo-shadow">
                        KAVRYX
                    </div>

                    <h1 class="game-logo">
                        KAVRYX
                    </h1>

                    <div class="logo-subtitle">
                        SURVIVE • BUILD • CONQUER
                    </div>

                </div>


                <div class="menu-buttons">

                    <button
                        class="menu-button primary"
                        id="playButton"
                    >
                        <span>ИГРАТЬ</span>
                    </button>


                    <button
                        class="menu-button"
                        id="shopButton"
                    >
                        <span>МАГАЗИН</span>
                    </button>


                    <button
                        class="menu-button"
                        id="achievementsButton"
                    >
                        <span>ДОСТИЖЕНИЯ</span>
                    </button>


                    <button
                        class="menu-button"
                        id="settingsButton"
                    >
                        <span>НАСТРОЙКИ</span>
                    </button>


                    <button
                        class="menu-button"
                        id="supportButton"
                    >
                        <span>ПОДДЕРЖКА</span>
                    </button>

                </div>


                <div class="version">
                    KAVRYX • EARLY DEVELOPMENT
                </div>

            </div>

        </main>


        <!-- =========================
             ИГРОВОЙ ЭКРАН
             ========================= -->

        <main id="gameScreen" class="screen">

            <canvas id="gameCanvas"></canvas>

        </main>

    </div>


    <script src="js/main.js"></script>
    <script src="js/game.js"></script>

</body>

</html>
